<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect x="8" y="8" width="104" height="104" rx="22" ry="22" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 屏幕外框 -->
  <rect x="25" y="30" width="70" height="45" rx="4" ry="4" fill="#2c3e50" stroke="#34495e" stroke-width="1"/>
  
  <!-- 屏幕内容 -->
  <rect x="28" y="33" width="64" height="39" rx="2" ry="2" fill="url(#screenGradient)"/>
  
  <!-- 投屏信号波纹 -->
  <g transform="translate(60, 52)" filter="url(#glow)">
    <!-- 中心点 -->
    <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.9"/>
    
    <!-- 波纹圈 -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- 屏幕支架 -->
  <rect x="55" y="75" width="10" height="8" rx="1" ry="1" fill="#2c3e50"/>
  <rect x="45" y="83" width="30" height="3" rx="1.5" ry="1.5" fill="#2c3e50"/>
  
  <!-- 投屏箭头 -->
  <g transform="translate(35, 90)">
    <path d="M 0 0 L 8 -4 L 8 -1 L 20 -1 L 20 1 L 8 1 L 8 4 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 22 -1 L 30 -4 L 30 -1 L 42 -1 L 42 1 L 30 1 L 30 4 Z" fill="#ffffff" opacity="0.7"/>
    <path d="M 44 -1 L 52 -4 L 52 -1 L 50 -1 L 50 1 L 52 1 L 52 4 Z" fill="#ffffff" opacity="0.5"/>
  </g>
  
  <!-- 高光效果 -->
  <rect x="8" y="8" width="104" height="52" rx="22" ry="22" fill="url(#highlight)" opacity="0.3"/>
  
  <defs>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>