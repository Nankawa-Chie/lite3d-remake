<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="youtube-app-container">
      <!-- 搜索栏 -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索YouTube视频..." />
        <button id="searchButton">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
            />
          </svg>
        </button>
      </div>

      <!-- 视频列表 -->
      <div class="video-list" id="videoList">
        <!-- 默认推荐视频 -->
        <div class="video-item" data-video-id="dQw4w9WgXcQ">
          <div class="video-thumbnail">
            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/mqdefault.jpg" alt="视频缩略图" />
            <div class="play-overlay">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>
          </div>
          <div class="video-info">
            <h3 class="video-title">Rick Astley - Never Gonna Give You Up</h3>
            <p class="video-channel">Rick Astley</p>
            <p class="video-stats">1.4B views • 14 years ago</p>
          </div>
        </div>

        <div class="video-item" data-video-id="9bZkp7q19f0">
          <div class="video-thumbnail">
            <img src="https://img.youtube.com/vi/9bZkp7q19f0/mqdefault.jpg" alt="视频缩略图" />
            <div class="play-overlay">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>
          </div>
          <div class="video-info">
            <h3 class="video-title">PSY - GANGNAM STYLE</h3>
            <p class="video-channel">officialpsy</p>
            <p class="video-stats">4.8B views • 11 years ago</p>
          </div>
        </div>

        <div class="video-item" data-video-id="kJQP7kiw5Fk">
          <div class="video-thumbnail">
            <img src="https://img.youtube.com/vi/kJQP7kiw5Fk/mqdefault.jpg" alt="视频缩略图" />
            <div class="play-overlay">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>
          </div>
          <div class="video-info">
            <h3 class="video-title">Despacito</h3>
            <p class="video-channel">Luis Fonsi</p>
            <p class="video-stats">8.2B views • 6 years ago</p>
          </div>
        </div>
      </div>

      <!-- 视频播放器 -->
      <div class="video-player" id="videoPlayer" style="display: none">
        <div class="player-header">
          <button id="closePlayer" class="close-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            </svg>
          </button>
          <button id="castToTV" class="cast-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M21,3H3C1.89,3 1,3.89 1,5V8H3V5H21V19H14V21H21A2,2 0 0,0 23,19V5C23,3.89 22.1,3 21,3M1,10V12A9,9 0 0,1 10,21H12C12,14.92 7.07,10 1,10M1,14V16A5,5 0 0,1 6,21H8A7,7 0 0,0 1,14M1,18V21H4A3,3 0 0,0 1,18Z"
              />
            </svg>
            投屏到电视
          </button>
        </div>
        <div class="player-container">
          <iframe
            id="youtubeFrame"
            width="100%"
            height="100%"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="video-details">
          <h2 id="currentVideoTitle">视频标题</h2>
          <p id="currentVideoChannel">频道名称</p>
        </div>
      </div>

      <!-- 加载状态 -->
      <div class="loading" id="loading" style="display: none">
        <div class="spinner"></div>
        <p>正在搜索视频...</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
