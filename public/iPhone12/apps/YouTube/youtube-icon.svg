<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆角矩形 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect x="8" y="8" width="104" height="104" rx="22" ry="22" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- YouTube播放按钮 -->
  <g transform="translate(60, 60)">
    <!-- 白色播放三角形 -->
    <path d="M -15 -12 L -15 12 L 18 0 Z" fill="#FFFFFF" stroke="none"/>
  </g>
  
  <!-- 高光效果 -->
  <rect x="8" y="8" width="104" height="52" rx="22" ry="22" fill="url(#highlight)" opacity="0.3"/>
  
  <defs>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>